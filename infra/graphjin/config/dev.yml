# GraphJin — CORTEX read layer (GraphQL → SQL). Used with GO_ENV=development.
# Mutations/DDL: use FastAPI only. See infra/graphjin/README.md

app_name: "CORTEX GraphJin"
host_port: "0.0.0.0:8080"
web_ui: true
production: false
log_level: "info"
http_compress: true
cors_allowed_origins:
  - "http://localhost:3000"
  - "http://127.0.0.1:3000"
  - "http://localhost:5173"
  - "http://127.0.0.1:5173"
cors_allowed_headers: ["Authorization", "Content-Type", "X-Request-ID"]

database:
  type: postgres
  host: postgres
  port: 5432
  dbname: cortex
  user: cortex
  password: ""
  schema: public
  pool_size: 10

mcp:
  disable: true

auth:
  type: none
  development: true

tables:
  - name: organizations
  - name: frameworks
  - name: controls
  - name: findings
  - name: assessment_results
  - name: entities

# Never expose over GraphJin (dev auth is none): auth/PII/audit tables.
# - users: credential hashes
# - audit_log: append-only compliance record (must not be reachable read layer)
blocklist:
  - users
  - audit_log
