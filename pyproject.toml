[build-system]
requires = ["setuptools>=84.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["api*", "compliance*", "core*", "db*", "ontology*"]

[project]
name = "cortex"
version = "0.1.0"
description = "CORTEX — enterprise organizational intelligence (ZTAIP)"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13.4",
    "structlog",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "uvicorn[standard]>=0.52.1",
    "sqlalchemy[asyncio]>=2.0.51",
    "asyncpg",
    "pypdf>=6.15.0",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.32",
    "python-jose[cryptography]>=3.5.0",
    "passlib[bcrypt]==1.7.4",
    "cryptography>=50.0.0",
    # Security: minimum versions to avoid known CVEs in transitive deps (pip-audit)
    "filelock>=3.32.2",
    "future>=1.0.0",
    "idna>=3.18",  # GHSA-jjg7-2v4v-x38h — DoS via crafted domain in idna.encode
    "marshmallow>=4.3.1",
    "slowapi>=0.1.10",
    "anthropic>=0.121.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "httpx>=0.28.1",
    "psycopg2-binary>=2.9.12",
    "ruff>=0.16.2",
    "mypy>=2.3.0",
    "bandit[toml]>=1.9.4",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 120
exclude = [".git", ".venv", "venv", "__pycache__"]

# Pin the historical Ruff default. CI installs ruff unpinned; without an
# explicit select, newer Ruff enables extra rule families (I/UP/B/…) and
# the lint job fails on pre-existing style, not defects.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_return_any = true
warn_unused_ignores = true

[tool.bandit]
exclude_dirs = ["tests", ".venv", "venv"]
skips = ["B101"]  # assert_used — tests use assert
