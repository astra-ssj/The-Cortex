[build-system]
requires = ["setuptools>=82.0.1", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["api*", "compliance*", "core*", "db*", "ontology*", "workers*"]

[project]
name = "cortex"
version = "0.1.0"
description = "CORTEX — enterprise organizational intelligence (ZTAIP)"
readme = "CORTEX_SETUP.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13.4",
    "structlog",
    "fastapi>=0.139.0",
    "httpx>=0.28.1",
    "uvicorn[standard]>=0.49.0",
    "sqlalchemy[asyncio]>=2.0.51",
    "asyncpg",
    "pypdf>=6.14.2",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.32",
    "python-jose[cryptography]>=3.5.0",
    "passlib[bcrypt]==1.7.4",
    "cryptography>=49.0.0",
    # Security: minimum versions to avoid known CVEs in transitive deps (pip-audit)
    "filelock>=3.29.5",
    "future>=1.0.0",
    "idna>=3.18",  # GHSA-jjg7-2v4v-x38h — DoS via crafted domain in idna.encode
    "marshmallow>=4.3.0",
    "slowapi>=0.1.10",
    "reportlab>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "httpx>=0.28.1",
    "psycopg2-binary>=2.9.12",
    "ruff>=0.15.20",
    "mypy>=2.1.0",
    "bandit[toml]>=1.9.4",
]
azure = [
    "azure-identity>=1.25.3",
    "azure-mgmt-resource>=26.0.0",
    "cryptography>=49.0.0",
]
aws = [
    "boto3>=1.43.40",
    "cryptography>=49.0.0",
]
# Transilience Shasta (cloud CSPM). NOT the unrelated PyPI package `shasta` (PaSh shell AST).
# Install: pip install -e ".[shasta-scan]"  (requires git/network).
shasta-scan = [
    "shasta @ git+https://github.com/transilienceai/shasta.git",
]
dev-aws = [
    "moto[aws]>=5.2.2",
]
# Redis-backed Shasta scan worker (optional; API uses in-process BackgroundTasks when unset).
redis-queue = [
    "redis[hiredis]>=8.0.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = [".", "services/compliance-engine"]

[tool.ruff]
target-version = "py312"
line-length = 120
exclude = [".git", ".venv", "venv", "__pycache__"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_return_any = true
warn_unused_ignores = true

# Connectors return third-party SDK objects (boto3.Session, Azure clients); avoid noisy Any warnings
[[tool.mypy.overrides]]
module = ["app.connectors.aws.*", "app.connectors.azure.*", "app.connectors.shasta.*"]
warn_return_any = false

[tool.bandit]
exclude_dirs = ["tests", ".venv", "venv"]
skips = ["B101"]  # assert_used — tests use assert
