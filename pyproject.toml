[build-system]
requires = ["setuptools>=84.2.0", "wheel"]
build-backend = "setuptools.build_meta"


[tool.setuptools.packages.find]
where = ["."]
include = ["api*", "compliance*", "core*", "db*", "ontology*"]

[project]
name = "astra-grc-ce"
version = "1.1.0"
description = "Astra GRC Community Edition — GRC competency training (ZTAIP)"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.14.1",
    "structlog",
    "fastapi>=0.156.0",
    "httpx>=0.28.1",
    "uvicorn[standard]>=0.54.0",
    "sqlalchemy[asyncio]>=2.1.5",
    "asyncpg",
    "pypdf>=6.21.2",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.32",
    "PyJWT>=2.15.1",
    "passlib[bcrypt]==1.7.4",
    "cryptography>=50.0.2",
    # Security: minimum versions to avoid known CVEs in transitive deps (pip-audit)
    "filelock>=4.2.4",
    "future>=1.0.0",
    "idna>=3.20",  # GHSA-jjg7-2v4v-x38h — DoS via crafted domain in idna.encode
    "marshmallow>=4.3.1",
    "slowapi>=0.1.10",
    "anthropic>=1.16.0",
    "redis>=8.1.0",
    "mmh3>=5.3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "httpx>=0.28.1",
    "psycopg2-binary>=2.9.13",
    "ruff>=0.17.1",
    "mypy>=2.4.0",
    "bandit[toml]>=1.9.4",
    "moto>=5.2.4",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 120
exclude = [".git", ".venv", "venv", "__pycache__"]

# Pin the historical Ruff default. CI installs ruff unpinned; without an
# explicit select, newer Ruff enables extra rule families (I/UP/B/…) and
# the lint job fails on pre-existing style, not defects.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_return_any = true
warn_unused_ignores = true

[tool.bandit]
exclude_dirs = ["tests", ".venv", "venv"]
skips = ["B101"]  # assert_used — tests use assert
