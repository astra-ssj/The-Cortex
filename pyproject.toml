[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cortex"
version = "0.1.0"
description = "CORTEX — enterprise organizational intelligence (ZTAIP)"
readme = "CORTEX_SETUP.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2",
    "structlog",
    "fastapi>=0.109",
    "uvicorn[standard]>=0.27",
    "sqlalchemy[asyncio]>=2",
    "asyncpg",
    "pypdf>=4",
    "python-docx>=1.0",
    "python-multipart>=0.0.22",
    # Security: minimum versions to avoid known CVEs in transitive deps (pip-audit)
    "filelock>=3.20.3",
    "future>=0.18.3",
    "marshmallow>=4.1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4",
    "httpx>=0.27",
    "psycopg2-binary>=2.9",
    "ruff>=0.1",
    "mypy>=1.0",
    "bandit[toml]>=1.7",
]
azure = [
    "azure-identity>=1.15",
    "azure-mgmt-resource>=23.0",
    "cryptography>=42",
]
aws = [
    "boto3>=1.34",
    "cryptography>=42",
]
dev-aws = [
    "moto[aws]>=5.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = [".", "services/compliance-engine"]

[tool.ruff]
target-version = "py312"
line-length = 120
exclude = [".git", ".venv", "venv", "__pycache__"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_return_any = true
warn_unused_ignores = true

# Connectors return third-party SDK objects (boto3.Session, Azure clients); avoid noisy Any warnings
[[tool.mypy.overrides]]
module = ["app.connectors.aws.*", "app.connectors.azure.*"]
warn_return_any = false

[tool.bandit]
exclude_dirs = ["tests", ".venv", "venv"]
skips = ["B101"]  # assert_used — tests use assert
