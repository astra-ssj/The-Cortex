[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cortex"
version = "0.1.0"
description = "CORTEX — enterprise organizational intelligence (ZTAIP)"
readme = "CORTEX_SETUP.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2",
    "structlog",
    "fastapi>=0.109",
    "uvicorn[standard]>=0.27",
    "sqlalchemy[asyncio]>=2",
    "asyncpg",
    "pypdf>=4",
    "python-docx>=1.0",
    "python-multipart>=0.0.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-asyncio>=0.21",
    "httpx>=0.27",
    "psycopg2-binary>=2.9",
]
azure = [
    "azure-identity>=1.15",
    "azure-mgmt-resource>=23.0",
    "cryptography>=42",
]
aws = [
    "boto3>=1.34",
    "cryptography>=42",
]
dev-aws = [
    "moto[aws]>=5.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = [".", "services/compliance-engine"]
