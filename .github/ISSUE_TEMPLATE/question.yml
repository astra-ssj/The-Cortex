name: Community question
description: Ask a setup, usage, or contribution question
title: "[Question]: "
labels:
  - question
body:
  - type: markdown
    attributes:
      value: |
        Support is best effort. Do not include credentials, personal data, customer records, or security vulnerability details.
  - type: textarea
    id: goal
    attributes:
      label: What are you trying to do?
    validations:
      required: true
  - type: textarea
    id: attempted
    attributes:
      label: What have you tried?
      description: Include relevant commands and sanitised output.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python/Node versions, and deployment mode.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I read SUPPORT.md and searched existing issues.
          required: true
        - label: I removed secrets and confidential information.
          required: true
