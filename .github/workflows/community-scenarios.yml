name: Community scenario validation

on:
  push:
    branches: [main]
    paths:
      - "contrib/scenarios/**"
      - ".github/workflows/community-scenarios.yml"
  pull_request:
    branches: [main]
    paths:
      - "contrib/scenarios/**"
      - ".github/workflows/community-scenarios.yml"

permissions:
  contents: read

jobs:
  validate:
    name: Validate untrusted scenario data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install standalone validator dependencies
        run: python -m pip install "PyYAML==6.0.3" "pytest>=9.1.1,<10"

      - name: Check JSON Schema syntax
        run: python -m json.tool contrib/scenarios/scenario.schema.json

      - name: Validate all committed scenario YAML
        run: python contrib/scenarios/validate_scenario.py contrib/scenarios

      - name: Run validator tests
        run: pytest -q contrib/scenarios/tests
