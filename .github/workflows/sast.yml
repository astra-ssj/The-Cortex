name: SAST Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  sast:
    name: SAST — Bandit + Safety
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          pip install bandit safety
          if [ -f pyproject.toml ]; then
            pip install -e ".[dev]" 2>/dev/null || \
            pip install -e "." 2>/dev/null || \
            echo "pyproject install skipped"
          fi

      - name: Bandit
        run: |
          bandit -r api core compliance db ontology -ll --skip B101

      - name: Safety (frozen environment)
        run: |
          pip freeze > /tmp/project-deps.txt
          if [ ! -s /tmp/project-deps.txt ]; then
            echo "Safety: no packages to check, skipping"
            exit 0
          fi
          safety check -r /tmp/project-deps.txt --output text || true
        continue-on-error: true
