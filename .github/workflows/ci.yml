name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend — Build + Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: npm audit
        run: npm audit --audit-level=high || true

  backend:
    name: Backend — Lint + SAST
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install bandit ruff
          if [ -f pyproject.toml ]; then
            pip install -e ".[dev]" 2>/dev/null || \
            pip install -e "." 2>/dev/null || \
            echo "pyproject.toml install skipped"
          fi
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt \
              2>/dev/null || true
          fi

      - name: Ruff lint
        run: |
          set -e
          paths=""
          for d in services/compliance-engine/app api core; do
            if [ -d "$d" ]; then
              paths="$paths $d"
            fi
          done
          if [ -z "$paths" ]; then
            echo "Ruff: no matching paths found, skipping"
            exit 0
          fi
          ruff check $paths --ignore E501

      - name: Bandit SAST
        run: |
          if [ ! -d services/compliance-engine/app ]; then
            echo "Bandit: scan path not found, skipping"
            exit 0
          fi
          bandit -r services/compliance-engine/app/ -ll --skip B101

  security:
    name: Security — Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Python dependency audit
        run: |
          pip install pip-audit
          if [ -f pyproject.toml ]; then
            pip install -e "." 2>/dev/null || true
          fi
          pip-audit || true
        continue-on-error: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Frontend dependency audit
        run: |
          cd frontend
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm audit --audit-level=high || true
        continue-on-error: true
