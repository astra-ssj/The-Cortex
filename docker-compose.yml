# CORTEX — Postgres + API + one-time org structure seed.
# Usage: set POSTGRES_PASSWORD and optionally DATABASE_URL in env or .env; then:
#   docker compose up -d
# Then: curl http://localhost:8000/health && curl http://localhost:8000/api/v1/system/ready && curl http://localhost:8000/api/v1/frameworks
# Security: no privileged containers; postgres has no published ports (internal only); healthcheck on postgres.

services:
  postgres:
    image: postgres:16
    # Do not add privileged: true or unnecessary port exposure.
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cortex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-cortex}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/01_init.sql
      - ./migrations/002_cortex_ontology.sql:/docker-entrypoint-initdb.d/02_ontology.sql
      - ./migrations/003_assessment_results.sql:/docker-entrypoint-initdb.d/03_assessment_results.sql
      - ./services/graphjin/migrations/003_controls_authoritative.sql:/docker-entrypoint-initdb.d/04_controls_authoritative.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cortex} -d ${POSTGRES_DB:-cortex}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-cortex}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-cortex}
    depends_on:
      postgres:
        condition: service_healthy

  seed:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - .:/app
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://cortex:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-cortex}}
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "pip install -q psycopg2-binary && python scripts/seed_org_structure.py"

volumes:
  postgres_data:
