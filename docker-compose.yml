# CORTEX — Postgres + API + one-time org structure seed.
# Usage: set POSTGRES_PASSWORD and optionally DATABASE_URL in env or .env; then:
#   docker compose up -d
# Then: curl http://localhost:8000/health && curl http://localhost:8000/api/v1/system/ready && curl http://localhost:8000/api/v1/frameworks
# Security: no privileged containers; postgres has no published ports (internal only); healthcheck on postgres.

services:
  postgres:
    image: postgres:16
    # Do not add privileged: true or unnecessary port exposure.
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cortex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-cortex}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Single migration lane (filename order == apply order). Keep in sync with scripts/apply_cortex_schema.sh.
      - ./init.sql:/docker-entrypoint-initdb.d/01_init.sql
      - ./migrations/002_cortex_ontology.sql:/docker-entrypoint-initdb.d/02_cortex_ontology.sql:ro
      - ./migrations/003_assessment_results.sql:/docker-entrypoint-initdb.d/03_assessment_results.sql:ro
      - ./migrations/004_controls_authoritative.sql:/docker-entrypoint-initdb.d/04_controls_authoritative.sql:ro
      - ./migrations/005_multi_tenancy.sql:/docker-entrypoint-initdb.d/05_multi_tenancy.sql:ro
      - ./migrations/006_assessment_results_status_risk.sql:/docker-entrypoint-initdb.d/06_assessment_results_status_risk.sql:ro
      - ./migrations/007_assessment_results_fix.sql:/docker-entrypoint-initdb.d/07_assessment_results_fix.sql:ro
      - ./migrations/008_human_review_queue.sql:/docker-entrypoint-initdb.d/08_human_review_queue.sql:ro
      - ./migrations/009_shasta_cloud.sql:/docker-entrypoint-initdb.d/09_shasta_cloud.sql:ro
      - ./migrations/010_shasta_evidence_control_links.sql:/docker-entrypoint-initdb.d/10_shasta_evidence_links.sql:ro
      - ./migrations/011_operational_persistence.sql:/docker-entrypoint-initdb.d/11_operational_persistence.sql:ro
      - ./migrations/012_security_auth.sql:/docker-entrypoint-initdb.d/12_security_auth.sql:ro
      - ./migrations/013_compliance_graph.sql:/docker-entrypoint-initdb.d/13_compliance_graph.sql:ro
      - ./migrations/014_microsoft_integration.sql:/docker-entrypoint-initdb.d/14_microsoft_integration.sql:ro
      - ./migrations/015_relationship_graph.sql:/docker-entrypoint-initdb.d/15_relationship_graph.sql:ro
      - ./migrations/016_rls_and_append_only_audit.sql:/docker-entrypoint-initdb.d/16_rls_and_append_only_audit.sql:ro
      - ./migrations/017_learning_loop.sql:/docker-entrypoint-initdb.d/17_learning_loop.sql:ro
      - ./migrations/018_drop_decommissioned_modules.sql:/docker-entrypoint-initdb.d/18_drop_decommissioned_modules.sql:ro
      - ./migrations/019_scenario_content.sql:/docker-entrypoint-initdb.d/19_scenario_content.sql:ro
      - ./migrations/019_scenario_content_seed.sql:/docker-entrypoint-initdb.d/19b_scenario_content_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cortex} -d ${POSTGRES_DB:-cortex}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # GraphQL read layer: same DB as FastAPI. Dev auth is disabled, so the port is
  # bound to 127.0.0.1 only — reachable from the host for debugging, never from the
  # network. The frontend/API reach it over the internal Docker network by service
  # name (`graphjin:8080`), which is unaffected by the host bind. See infra/graphjin/README.md
  graphjin:
    image: dosco/graphjin:3.18.10
    container_name: cortex-graphjin
    restart: unless-stopped
    # Entrypoint is `graphjin`; without `serve` the container prints CLI help and exits.
    command: ["serve", "--path", "/app/config"]
    working_dir: /app
    volumes:
      - ./infra/graphjin/config:/app/config:ro
    environment:
      GO_ENV: development
      GJ_DATABASE_HOST: postgres
      GJ_DATABASE_PORT: "5432"
      GJ_DATABASE_USER: ${POSTGRES_USER:-cortex}
      GJ_DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      GJ_DATABASE_NAME: ${POSTGRES_DB:-cortex}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      # cortex_app is the non-superuser role (migration 016) so RLS + audit grants bind.
      DATABASE_URL: postgresql+asyncpg://cortex_app:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-cortex}
      # No insecure defaults: these must be set explicitly (in .env for local dev).
      # Using :? makes the stack refuse to start rather than silently shipping
      # admin/admin or a well-known stub token. See .env.example.
      CORTEX_LEGACY_DEMO_PASSWORD: ${CORTEX_LEGACY_DEMO_PASSWORD:?set CORTEX_LEGACY_DEMO_PASSWORD in .env}
      COMPLIANCE_ENGINE_STUB_PASSWORD: ${COMPLIANCE_ENGINE_STUB_PASSWORD:?set COMPLIANCE_ENGINE_STUB_PASSWORD in .env}
      COMPLIANCE_ENGINE_STUB_ACCESS_TOKEN: ${COMPLIANCE_ENGINE_STUB_ACCESS_TOKEN:?set COMPLIANCE_ENGINE_STUB_ACCESS_TOKEN in .env}
      # LLM provider chain (Track B ingest) — set keys in .env or shell; stub used when unset.
      CORTEX_LLM_PROVIDERS: ${CORTEX_LLM_PROVIDERS:-anthropic,openai,stub}
      CORTEX_LLM_TIMEOUT_SECONDS: ${CORTEX_LLM_TIMEOUT_SECONDS:-90}
      CORTEX_LLM_MAX_INGEST_CHARS: ${CORTEX_LLM_MAX_INGEST_CHARS:-24000}
      CORTEX_ASSESSMENT_LLM_ENABLED: ${CORTEX_ASSESSMENT_LLM_ENABLED:-1}
      CORTEX_ASSESSMENT_MAX_CONTROLS: ${CORTEX_ASSESSMENT_MAX_CONTROLS:-5}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-20250514}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
    depends_on:
      postgres:
        condition: service_healthy

  seed:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - .:/app
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://cortex:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-cortex}}
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "pip install -q psycopg2-binary && python scripts/seed_org_structure.py"

volumes:
  postgres_data:
