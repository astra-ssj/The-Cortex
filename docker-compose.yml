# CORTEX — Postgres + one-time org structure seed.
# Usage: set POSTGRES_PASSWORD and optionally DATABASE_URL in env or .env; then:
#   docker-compose up -d postgres && docker-compose run --rm seed

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cortex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-cortex}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/01_init.sql
      - ./migrations/002_cortex_ontology.sql:/docker-entrypoint-initdb.d/02_ontology.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cortex} -d ${POSTGRES_DB:-cortex}"]
      interval: 5s
      timeout: 5s
      retries: 5

  seed:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - .:/app
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://cortex:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-cortex}}
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "pip install -q psycopg2-binary && python scripts/seed_org_structure.py"

volumes:
  postgres_data:
