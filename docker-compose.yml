# CORTEX — Postgres + API + one-time org structure seed.
# Usage: set POSTGRES_PASSWORD and optionally DATABASE_URL in env or .env; then:
#   docker compose up -d
# Then: curl http://localhost:8000/health && curl http://localhost:8000/api/v1/system/ready && curl http://localhost:8000/api/v1/frameworks
# Security: no privileged containers; postgres has no published ports (internal only); healthcheck on postgres.

services:
  postgres:
    image: postgres:16
    # Do not add privileged: true or unnecessary port exposure.
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cortex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-cortex}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/01_init.sql
      - ./migrations/002_cortex_ontology.sql:/docker-entrypoint-initdb.d/02_ontology.sql
      - ./migrations/003_assessment_results.sql:/docker-entrypoint-initdb.d/03_assessment_results.sql
      - ./services/graphjin/migrations/003_controls_authoritative.sql:/docker-entrypoint-initdb.d/04_controls_authoritative.sql:ro
      - ./services/graphjin/migrations/004_multi_tenancy.sql:/docker-entrypoint-initdb.d/05_multi_tenancy.sql:ro
      - ./migrations/004_assessment_results_status_risk.sql:/docker-entrypoint-initdb.d/06_assessment_results_status_risk.sql:ro
      - ./services/graphjin/migrations/005_assessment_results_fix.sql:/docker-entrypoint-initdb.d/07_assessment_results_fix.sql:ro
      - ./migrations/006_human_review_queue.sql:/docker-entrypoint-initdb.d/08_human_review_queue.sql:ro
      - ./migrations/009_shasta_cloud.sql:/docker-entrypoint-initdb.d/09_shasta_cloud.sql:ro
      - ./migrations/010_shasta_evidence_control_links.sql:/docker-entrypoint-initdb.d/10_shasta_evidence_links.sql:ro
      - ./migrations/012_security_auth.sql:/docker-entrypoint-initdb.d/11_security_auth.sql:ro
      - ./services/graphjin/migrations:/graphjin/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cortex} -d ${POSTGRES_DB:-cortex}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # GraphQL read layer: same DB as FastAPI. Dev auth disabled — do not expose 8080 to the internet. See services/graphjin/README.md
  # Default stack omits GraphJin; start with: docker compose --profile graphql up -d
  graphjin:
    profiles:
      - graphql
    image: dosco/graphjin:3.18.10
    # Entrypoint is `graphjin`; without `serve` the container prints CLI help and exits.
    command: ["serve", "--path", "/app/config"]
    working_dir: /app
    volumes:
      - ./services/graphjin/config:/app/config:ro
    environment:
      GO_ENV: development
      GJ_DATABASE_HOST: postgres
      GJ_DATABASE_PORT: "5432"
      GJ_DATABASE_USER: ${POSTGRES_USER:-cortex}
      GJ_DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      GJ_DATABASE_NAME: ${POSTGRES_DB:-cortex}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-cortex}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-cortex}
      # When set (e.g. redis://redis:6379/0 with profile ``queue``), Shasta scans enqueue to Redis instead of in-process BackgroundTasks.
      REDIS_URL: ${REDIS_URL:-}
      SHASTA_REDIS_URL: ${SHASTA_REDIS_URL:-}
      # Local/demo only — override in production (see README security defaults).
      CORTEX_LEGACY_DEMO_PASSWORD: ${CORTEX_LEGACY_DEMO_PASSWORD:-admin}
      COMPLIANCE_ENGINE_STUB_PASSWORD: ${COMPLIANCE_ENGINE_STUB_PASSWORD:-demo}
      COMPLIANCE_ENGINE_STUB_ACCESS_TOKEN: ${COMPLIANCE_ENGINE_STUB_ACCESS_TOKEN:-compliance-stub-dev-token}
    depends_on:
      postgres:
        condition: service_healthy

  # Optional: durable Shasta jobs — ``docker compose --profile queue up -d`` and set REDIS_URL=redis://redis:6379/0 (and run shasta-worker).
  redis:
    profiles:
      - queue
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_queue_data:/data

  shasta-worker:
    profiles:
      - queue
    build: .
    command: ["python", "workers/shasta_worker.py"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-cortex}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-cortex}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      PYTHONPATH: /app:/app/services/compliance-engine
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  seed:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - .:/app
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://cortex:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-cortex}}
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "pip install -q psycopg2-binary && python scripts/seed_org_structure.py"

volumes:
  postgres_data:
  redis_queue_data:
